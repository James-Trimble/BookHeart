name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test, build and check the app starts
        shell: pwsh
        run: ./build/build.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: StoryHeart-windows
          path: release/*
