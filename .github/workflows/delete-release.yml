name: Delete release

# Run from the Actions tab ("Run workflow") with a tag like v0.1.0. Deletes that GitHub release and its tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the release to delete, like v0.1.0
        required: true

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the release and its tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
