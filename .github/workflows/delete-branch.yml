name: Delete branch

# Run from the Actions tab ("Run workflow") with a branch name. Deletes that branch from GitHub.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Name of the branch to delete
        required: true

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ inputs.branch }}
        run: |
          if [ "$BRANCH" = "main" ]; then echo "Refusing to delete main."; exit 1; fi
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH"
